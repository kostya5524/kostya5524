<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160" role="img" aria-label="generated by GitHub Actions — first run pending">
  <title>generated by GitHub Actions — first run pending</title>
  <style><![CDATA[
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace; }
    .d1 { animation: b 1.5s ease-in-out infinite; }
    .d2 { animation: b 1.5s ease-in-out .25s infinite; }
    .d3 { animation: b 1.5s ease-in-out .5s infinite; }
    @keyframes b { 0%,100%{opacity:.2} 50%{opacity:1} }
    @media (prefers-reduced-motion: reduce) { .d1,.d2,.d3 { animation: none } }
  ]]></style>
  <rect x="1" y="1" width="898" height="158" rx="12" fill="none" stroke="#7d8590" stroke-opacity=".35" stroke-dasharray="6 6"/>
  <g transform="translate(450 66)">
    <circle class="d1" cx="-22" cy="0" r="6" fill="#a3e635"/>
    <circle class="d2" cx="0"   cy="0" r="6" fill="#4ade80"/>
    <circle class="d3" cx="22"  cy="0" r="6" fill="#a3e635"/>
  </g>
  <text class="mono" x="450" y="105" font-size="14" fill="#7d8590" text-anchor="middle">generated by GitHub Actions — waiting for the first run</text>
  <text class="mono" x="450" y="128" font-size="12" fill="#7d8590" fill-opacity=".7" text-anchor="middle">Actions → run the workflow manually to fill this in</text>
</svg>
