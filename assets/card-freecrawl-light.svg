<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="900" height="210" role="img" aria-label="freecrawl — MCP server with 29 web tools for AI agents">
  <title>freecrawl — MCP server with 29 web tools for AI agents</title>
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef4ea"/>
    </linearGradient>
    <radialGradient id="cglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2da44e" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#2da44e" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ccard"><rect x="0" y="0" width="900" height="210" rx="14"/></clipPath>
  </defs>

  <style><![CDATA[
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace; }
    .n1 { animation: node 3s ease-in-out infinite; }
    .n2 { animation: node 3s ease-in-out .5s infinite; }
    .n3 { animation: node 3s ease-in-out 1s infinite; }
    .n4 { animation: node 3s ease-in-out 1.5s infinite; }
    @keyframes node { 0%,100%{ opacity:.25 } 50%{ opacity:1 } }
    .flow { stroke-dasharray: 4 6; animation: flow 2.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -40 } }
    @media (prefers-reduced-motion: reduce) { .n1,.n2,.n3,.n4,.flow { animation: none } }
  ]]></style>

  <g clip-path="url(#ccard)">
    <rect width="900" height="210" fill="url(#cbg)"/>
    <ellipse cx="760" cy="105" rx="240" ry="150" fill="url(#cglow)"/>
  </g>
  <rect x="1" y="1" width="898" height="208" rx="14" fill="none" stroke="#1a7f37" stroke-opacity=".3"/>

  <!-- repo title -->
  <text class="mono" x="34" y="48" font-size="13" fill="#656d76">kostya5524 /</text>
  <text class="mono" x="34" y="76" font-size="26" fill="#1a7f37" font-weight="700">freecrawl</text>

  <!-- description -->
  <text class="mono" x="34" y="110" font-size="14" fill="#1f2328">An MCP server that gives an AI agent 29 web tools: read bot-protected</text>
  <text class="mono" x="34" y="132" font-size="14" fill="#1f2328">pages, multi-engine search, reverse image search, structured extraction,</text>
  <text class="mono" x="34" y="154" font-size="14" fill="#1f2328">change monitoring. Runs locally — no API keys.</text>

  <!-- chips -->
  <g class="mono" font-size="11.5">
    <g><rect x="34" y="170" width="66" height="24" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-opacity=".35"/>
       <text x="67" y="186" fill="#1a7f37" text-anchor="middle">Python</text></g>
    <g><rect x="108" y="170" width="52" height="24" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-opacity=".35"/>
       <text x="134" y="186" fill="#1a7f37" text-anchor="middle">MCP</text></g>
    <g><rect x="168" y="170" width="86" height="24" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-opacity=".35"/>
       <text x="211" y="186" fill="#1a7f37" text-anchor="middle">Playwright</text></g>
    <g><rect x="262" y="170" width="106" height="24" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-opacity=".35"/>
       <text x="315" y="186" fill="#1a7f37" text-anchor="middle">no API keys</text></g>
  </g>

  <!-- agent -> tools diagram -->
  <g transform="translate(600 0)">
    <circle cx="40" cy="105" r="26" fill="none" stroke="#1a7f37" stroke-opacity=".55"/>
    <text class="mono" x="40" y="102" font-size="10" fill="#1a7f37" text-anchor="middle">AI</text>
    <text class="mono" x="40" y="114" font-size="10" fill="#1a7f37" text-anchor="middle">agent</text>

    <path class="flow" d="M68 105 H126" stroke="#1a7f37" stroke-opacity=".7" fill="none"/>
    <path class="flow" d="M68 96 Q100 60 126 55"  stroke="#1a7f37" stroke-opacity=".45" fill="none"/>
    <path class="flow" d="M68 114 Q100 150 126 155" stroke="#1a7f37" stroke-opacity=".45" fill="none"/>

    <g class="mono" font-size="10.5" fill="#ffffff">
      <g class="n1"><rect x="126" y="42" width="122" height="26" rx="13" fill="#1a7f37"/>
        <text x="187" y="59" text-anchor="middle">scrape · render</text></g>
      <g class="n2"><rect x="126" y="92" width="122" height="26" rx="13" fill="#1a7f37"/>
        <text x="187" y="109" text-anchor="middle">search · extract</text></g>
      <g class="n3"><rect x="126" y="142" width="122" height="26" rx="13" fill="#1a7f37"/>
        <text x="187" y="159" text-anchor="middle">images · monitor</text></g>
    </g>

    <text class="mono n4" x="187" y="192" font-size="11" fill="#656d76" text-anchor="middle">29 tools total</text>
  </g>
</svg>
