name: 3D contribution calendar

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

concurrency:
  group: profile-3d
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Uses PROFILE_TOKEN (PAT with read:user) when available — that is the only
      # way private contributions show up. Falls back to the built-in token.
      - name: Generate 3D contribution SVGs
        uses: yoshi389111/github-profile-3d-contrib@main
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # Another workflow may land a commit on main in between, so rebase and retry
      # instead of failing the run on a non-fast-forward push.
      - name: Commit result
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --staged --quiet && echo "nothing changed" && exit 0
          git commit -m "chore: refresh 3D contribution calendar"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash && git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt failed, retrying..."
            sleep 7
          done
          echo "could not push after 5 attempts"
          exit 1
