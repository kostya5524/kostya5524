name: Stats cards (self-generated)

# Renders the statistics cards inside my own repository instead of relying on
# public third-party instances (github-readme-stats / trophy), which are
# regularly rate-limited or down. Files land in ./assets and are committed here.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Needs a PAT (classic): public_repo + read:user.
      # Without the secret the job exits quietly instead of failing every night.
      - name: Is the token configured?
        id: check
        run: echo "ready=${{ secrets.METRICS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Skip notice
        if: steps.check.outputs.ready != 'true'
        run: echo "METRICS_TOKEN is not set — skipping. See SETUP.md, section 3."

      # ── overview ──────────────────────────────────────────────────────────
      - name: Overview (dark)
        if: steps.check.outputs.ready == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics-overview-dark.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Europe/Moscow
          config_display: large
          config_theme: dark
          committer_message: "chore: refresh stats cards"

      - name: Overview (light)
        if: steps.check.outputs.ready == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics-overview-light.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Europe/Moscow
          config_display: large
          config_theme: light
          committer_message: "chore: refresh stats cards"

      # ── languages ─────────────────────────────────────────────────────────
      - name: Languages (dark)
        if: steps.check.outputs.ready == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics-languages-dark.svg
          base: ""
          config_theme: dark
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          committer_message: "chore: refresh stats cards"

      - name: Languages (light)
        if: steps.check.outputs.ready == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics-languages-light.svg
          base: ""
          config_theme: light
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          committer_message: "chore: refresh stats cards"

      # ── isocalendar ───────────────────────────────────────────────────────
      - name: Calendar (dark)
        if: steps.check.outputs.ready == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics-isocalendar-dark.svg
          base: ""
          config_theme: dark
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          committer_message: "chore: refresh stats cards"

      - name: Calendar (light)
        if: steps.check.outputs.ready == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics-isocalendar-light.svg
          base: ""
          config_theme: light
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          committer_message: "chore: refresh stats cards"

      # ── habits ────────────────────────────────────────────────────────────
      - name: Habits (dark)
        if: steps.check.outputs.ready == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics-habits-dark.svg
          base: ""
          config_theme: dark
          config_timezone: Europe/Moscow
          config_display: large
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          committer_message: "chore: refresh stats cards"

      - name: Habits (light)
        if: steps.check.outputs.ready == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics-habits-light.svg
          base: ""
          config_theme: light
          config_timezone: Europe/Moscow
          config_display: large
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          committer_message: "chore: refresh stats cards"
