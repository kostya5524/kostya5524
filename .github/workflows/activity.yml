name: Activity feed

on:
  schedule:
    - cron: "15 */6 * * *"  # offset so it does not collide with the other pushers
  workflow_dispatch:

concurrency:
  group: activity
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Fills the block between <!--START_SECTION:activity--> markers in README.md
      - uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_MSG: "chore: refresh activity feed"
          MAX_LINES: 5
